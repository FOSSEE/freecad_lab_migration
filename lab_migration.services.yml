
services:
  lab_migration_global:
    class: '\Drupal\lab_migration\Services\LabMigrationGlobalfunction'

  lab_migration_email:
    class:  '\Drupal\lab_migration\Services\LabMigrationEmailFunction'

  lab_migration.mail_service:
    class: '\Drupal\lab_migration\Services\LabMigrationMailService'
    arguments:
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@messenger'

  lab_migration.ajax_helper:
    class: '\Drupal\lab_migration\Services\LabMigrationAjaxHelper'

  lab_migration.form.lab_migration_proposal_approval:
    class: Drupal\lab_migration\Form\LabMigrationProposalApprovalForm
    arguments: ['@plugin.manager.mail']

  